name: Refresh Water Quality Data

on:
  schedule:
    # Run on 1st and 15th of each month at 08:00 UTC
    # SDWIS data is updated twice monthly by the CA Water Boards
    - cron: '0 8 1,15 * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("data.table", "jsonlite", "curl"), repos = "https://cloud.r-project.org")'

      - name: Download raw data
        run: Rscript pipeline/01_download.R

      - name: Process data and generate JSON
        run: Rscript pipeline/02_process.R

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet site/data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          git commit -m "Update water quality data ($(date +%Y-%m-%d))"
          git push

      - name: Trigger deploy
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
