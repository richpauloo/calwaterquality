<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>California Water Quality</title>
  <meta name="description" content="Check drinking water quality for any community water system in California. Free, open-source, updated monthly.">
  <meta property="og:title" content="California Water Quality">
  <meta property="og:description" content="Check drinking water quality for your community water system.">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="header">
    <div class="header-inner">
      <a href="/" class="logo">CA Water Quality</a>
      <div id="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
        </svg>
        <input type="text" id="search" placeholder="Search by name, city, or county..." autocomplete="off" aria-label="Search water systems">
        <button id="search-clear" class="search-clear hidden" aria-label="Clear search">&times;</button>
        <ul id="search-results" class="hidden"></ul>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <div id="legend">
    <div class="legend-item"><span class="dot dot-compliance"></span> Meets standards</div>
    <div class="legend-item"><span class="dot dot-at-risk"></span> At risk</div>
    <div class="legend-item"><span class="dot dot-failing"></span> Failing</div>
    <div class="legend-item"><span class="dot dot-unknown"></span> Not assessed</div>
  </div>

  <div id="panel" class="panel">
    <div class="panel-drag" id="panel-drag">
      <div class="panel-handle"></div>
    </div>
    <div id="panel-content" class="panel-body">
      <div class="panel-intro">
        <p>Tap a water system on the map or search above to see water quality details.</p>
        <p class="muted">Data from the California State Water Resources Control Board, updated monthly. Covers 2,816 community water systems.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
